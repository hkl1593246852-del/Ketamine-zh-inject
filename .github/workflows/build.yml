name: Inject zh-Hans

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download original IPA
        run: |
          curl -L --retry 3 -o keta21b1.ipa https://withered.live/ipa/keta21b1.ipa
          ls -la keta21b1.ipa

      - name: Compile dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -dynamiclib \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -O2 \
            -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/KetamineZH.dylib \
            KetamineZH.m \
            -o KetamineZH.dylib
          ls -la KetamineZH.dylib
          otool -L KetamineZH.dylib

      - name: Inject
        run: |
          rm -rf work && mkdir work && cd work
          unzip -q ../keta21b1.ipa
          APP="Payload/Ketamine.app"
          BIN="$APP/Ketamine"
          mkdir -p "$APP/Frameworks"
          cp ../KetamineZH.dylib "$APP/Frameworks/"
          chmod +x "$BIN"
          python3 ../inject_dylib.py "$BIN" "@executable_path/Frameworks/KetamineZH.dylib"
          otool -L "$BIN" | head -12
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          cd ..

      - name: Sign
        run: |
          cd work
          brew install ldid 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "Payload/Ketamine.app/Ketamine"
            ldid -S "Payload/Ketamine.app/Frameworks/KetamineZH.dylib"
            echo "signed"
          else
            echo "ldid missing, unsigned (TrollStore will sign)"
          fi

      - name: Zip
        run: |
          cd work
          zip -qry ../Ketamine-zh-injected.ipa Payload
          cd ..
          ls -la Ketamine-zh-injected.ipa
          unzip -l Ketamine-zh-injected.ipa | grep -E "Frameworks|lproj" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Ketamine-zh-injected
          path: Ketamine-zh-injected.ipa
          retention-days: 30
